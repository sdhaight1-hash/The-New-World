name: Validate entry designs

on:
  push:
    paths:
      - "design/**"
      - ".github/workflows/validate-design.yml"
  pull_request:
    paths:
      - "design/**"
      - ".github/workflows/validate-design.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate theme palettes and page-layout schema
        run: python design/validate.py
