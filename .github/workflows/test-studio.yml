name: World Bible Studio tests

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/test-studio.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/test-studio.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: python -m pip install -r app/requirements.txt
      - run: python -m unittest discover -s app/tests -v
      - run: python -m py_compile app/server.py app/seed.py app/backup.py app/launch.py
      - run: python app/seed.py --db /tmp/world-bible-seed.sqlite3
      - run: python app/seed.py --db /tmp/world-bible-seed.sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/static/app.js
      - name: Install browser test harness
        run: |
          npm install --no-save --no-package-lock playwright
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install chromium
          fi
      - name: Browser navigation smoke test
        run: |
          python app/launch.py --db /tmp/world-bible-ui.sqlite3 --port 8775 --no-browser > /tmp/world-bible-studio.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8775/api/worlds >/dev/null; then break; fi
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || true)" node app/tests/smoke_ui.mjs
